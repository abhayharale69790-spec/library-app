name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Permissions for Gradle
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android Project
        run: npx --yes @capacitor/cli sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 24Library-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
